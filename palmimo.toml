# Palmimo Portal がこのアプリを一覧に出し、設定フォームを作り、起動するための定義。
# 仕様: https://github.com/Jizai-inc/palmimo-devkit/blob/main/doc/reference/app-manifest.md

schema = 1
name = "elevenlabs-voice"
description = "Call Palmimo by name to talk with an ElevenLabs agent that moves the robot and can run coding tasks with Claude Code on your laptop. Sleeps when told to or after a quiet spell."

# Run through `uv run` in the app's directory. {param} is replaced with the value set below.
command = [
  "python", "main.py",
  "--agent-id", "{agent_id}",
  "--speaker-device", "{speaker_device}",
  "--mic-device", "{mic_device}",
  "--volume", "{volume}",
  "--idle-timeout-secs", "{idle_timeout_secs}",
  "--max-session-secs", "{max_session_secs}",
  "--stt-model", "{stt_model}",
  "--desk-bridge-url", "{desk_bridge_url}",
]

# The mic and speaker are the audio device; the motors and face display are motor_display.
devices = ["audio", "motor_display"]

# No default: the Portal asks for it before the first run.
[params.agent_id]
type = "string"
pattern = "^[A-Za-z0-9_-]{1,64}$"
description = "Agent id from the ElevenLabs dashboard (Agents → your agent → the id in the page URL after /agents/agents/)."

[params.speaker_device]
type = "string"
default = "ReSpeaker"
pattern = "^[A-Za-z0-9 ._()-]{0,64}$"
max_length = 64
description = "Speaker to play through: part of its card name from `aplay -l`. Leave empty for the system default."

[params.mic_device]
type = "string"
default = "ReSpeaker"
pattern = "^[A-Za-z0-9 ._()-]{0,64}$"
max_length = 64
description = "Microphone to listen with: part of its name from `arecord -l`. Leave empty for the system default."

[params.volume]
type = "float"
default = 1.0
min = 0.0
max = 3.0
description = "Output gain; 1.0 is the voice's own level."

[params.idle_timeout_secs]
type = "float"
default = 25.0
min = 5.0
max = 600.0
description = "Go back to sleep after this many seconds without anyone talking. Keep it under 30, where ElevenLabs would start asking if you are still there."

[params.max_session_secs]
type = "float"
default = 600.0
min = 30.0
max = 3600.0
description = "Longest one conversation may run before the robot goes back to sleep, as a cost guard."

[params.stt_model]
type = "string"
default = "gpt-4o-mini-transcribe"
pattern = "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
description = "OpenAI model that transcribes speech near the robot to hear its name."

[params.desk_bridge_url]
type = "string"
default = ""
pattern = "^[A-Za-z0-9.:/_-]{0,128}$"
max_length = 128
description = "Desk bridge on your laptop for coding tasks with Claude Code, e.g. http://192.168.11.34:8765 (see desk_bridge/README.md). Leave empty to turn coding off."

[env.ELEVENLABS_API_KEY]
required = true
description = "ElevenLabs API key, used to start conversations with the agent."
help_url = "https://elevenlabs.io/app/settings/api-keys"

[env.OPENAI_API_KEY]
required = true
description = "OpenAI API key, used to transcribe speech near the robot and check whether it was called by name. Nothing reaches ElevenLabs until it is."
help_url = "https://platform.openai.com/api-keys"

[env.DESK_BRIDGE_TOKEN]
required = false
description = "The token from the desk bridge's config.toml on your laptop. Only needed when desk_bridge_url is set."
