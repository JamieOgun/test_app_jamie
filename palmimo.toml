# Palmimo Portal がこのアプリを一覧に出し、設定フォームを作り、起動するための定義。
# 仕様: https://github.com/Jizai-inc/palmimo-devkit/blob/main/doc/reference/app-manifest.md

schema = 1
name = "elevenlabs-voice"
description = "Talk with an ElevenLabs agent in real time through Palmimo's mic and speaker. One run is one conversation."

# Run through `uv run` in the app's directory. {param} is replaced with the value set below.
command = [
  "python", "main.py",
  "--agent-id", "{agent_id}",
  "--speaker-device", "{speaker_device}",
  "--mic-device", "{mic_device}",
  "--volume", "{volume}",
]

# The mic and speaker are both part of the audio device.
devices = ["audio"]

# No default: the Portal asks for it before the first run.
[params.agent_id]
type = "string"
pattern = "^[A-Za-z0-9_-]{1,64}$"
description = "Agent id from the ElevenLabs dashboard (Agents → your agent → it starts with agent_)."

[params.speaker_device]
type = "string"
default = "ReSpeaker"
pattern = "^[A-Za-z0-9 ._()-]{0,64}$"
max_length = 64
description = "Speaker to play through: part of its card name from `aplay -l`. Leave empty for the system default."

[params.mic_device]
type = "string"
default = "ReSpeaker"
pattern = "^[A-Za-z0-9 ._()-]{0,64}$"
max_length = 64
description = "Microphone to listen with: part of its name from `arecord -l`. Leave empty for the system default."

[params.volume]
type = "float"
default = 1.0
min = 0.0
max = 3.0
description = "Output gain; 1.0 is the voice's own level."

[env.ELEVENLABS_API_KEY]
required = true
description = "ElevenLabs API key, used to start conversations with the agent."
help_url = "https://elevenlabs.io/app/settings/api-keys"
