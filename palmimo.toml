# Palmimo Portal がこのアプリを一覧に出し、設定フォームを作り、起動するための定義。
# 仕様: https://github.com/Jizai-inc/palmimo-devkit/blob/main/doc/reference/app-manifest.md

schema = 1
name = "elevenlabs-voice"
description = "Speak a line on Palmimo's speaker with an ElevenLabs voice. Audio tags such as [excited] change the delivery."

# Run through `uv run` in the app's directory. {param} is replaced with the value set below.
command = [
  "python", "main.py",
  "--text", "{text}",
  "--lang", "{lang}",
  "--voice-id", "{voice_id}",
  "--speed", "{speed}",
  "--volume", "{volume}",
]

# The speaker is part of the audio device.
devices = ["audio"]

[params.text]
type = "string"
default = "[excited] Hello! I'm Palmimo."
max_length = 200
description = "What to say. May include ElevenLabs audio tags such as [excited] or [whispers]."

[params.lang]
type = "enum"
choices = ["en", "ja"]
default = "en"
description = "Language of the text."

[params.voice_id]
type = "string"
default = "JBFqnCBsd6RMkjVDRZzb"
pattern = "^[A-Za-z0-9]{1,64}$"
description = "Voice id from the ElevenLabs voice library."

[params.speed]
type = "float"
default = 1.0
min = 0.7
max = 1.2
description = "Speaking rate; 1.0 is natural, higher is faster."

[params.volume]
type = "float"
default = 1.0
min = 0.0
max = 3.0
description = "Output gain; 1.0 is the voice's own level."

[env.ELEVENLABS_API_KEY]
required = true
description = "ElevenLabs API key used to synthesize the voice."
help_url = "https://elevenlabs.io/app/settings/api-keys"
