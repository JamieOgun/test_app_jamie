[project]
name = "palmimo-desk-bridge"
version = "0.1.0"
description = "Runs Claude Code tasks on your laptop for Palmimo, and tells it when they finish."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.1",
]

[project.scripts]
desk-bridge = "desk_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk_bridge"]
